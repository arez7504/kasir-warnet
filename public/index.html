<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Warnet — Sistem POS & Rekonsiliasi Kasir</title>
  <meta name="description" content="Aplikasi kasir warnet modern desktop-first untuk manajemen transaksi produk, billing Cyberindo, dan rekonsiliasi shift.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Root SPA Container -->
  <div id="app"></div>

  <!-- Reusable Dialog Container -->
  <dialog id="app-dialog" aria-labelledby="dialog-title"></dialog>

  <!-- Floating Toast Notifications -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Core JavaScript Modules -->
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/dialog.js"></script>
  <script src="js/components/sidebar.js"></script>

  <!-- Page Modules -->
  <script src="js/pages/login.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/cashier-product.js"></script>
  <script src="js/pages/cashier-billing.js"></script>
  <script src="js/pages/history.js"></script>
  <script src="js/pages/expense.js"></script>
  <script src="js/pages/close-shift.js"></script>
  <script src="js/pages/manage-products.js"></script>
  <script src="js/pages/manage-packages.js"></script>
  <script src="js/pages/manage-users.js"></script>
  <script src="js/pages/reports.js"></script>

  <!-- Router & Main Entry -->
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
